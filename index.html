<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090d; --bg2:#0c0f15; --bg3:#111520; --bg4:#161b26;
  --border:#1c2535; --border2:#243044;
  --accent:#00c8ff; --green:#00e676; --red:#ff3355; --amber:#ffb300;
  --text:#c8d8ea; --text2:#7292b0; --text3:#3d5a78;
  --mono:'IBM Plex Mono',monospace; --sans:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:12px;padding:14px}
.wrap{max-width:1680px;margin:0 auto}
/* header */
.hdr{display:flex;align-items:center;gap:16px;padding:12px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;position:relative;overflow:hidden}
.hdr::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent) 40%,var(--green) 70%,transparent)}
.logo{font-size:17px;font-weight:600;letter-spacing:3px;color:var(--accent)}
.logo em{color:var(--text3);font-style:normal}
.badge{font-size:9px;letter-spacing:1px;padding:4px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:2px;color:var(--text2)}
.badge.live{color:var(--green);border-color:rgba(0,230,118,.3)}
.badge.demo{color:var(--amber);border-color:rgba(255,179,0,.3)}
.spacer{margin-left:auto}
/* gainers tape */
.tape{display:flex;align-items:center;gap:0;margin-top:8px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;overflow:hidden}
.tape-lbl{flex:none;padding:8px 12px;font-size:9px;letter-spacing:1.5px;color:var(--text3);background:var(--bg3);border-right:1px solid var(--border)}
.tape-scroll{display:flex;gap:18px;padding:8px 14px;overflow-x:auto;white-space:nowrap}
.tape-scroll::-webkit-scrollbar{height:0}
.chip{font-size:11px}
.chip b{color:var(--text)}
/* tabs */
.tabs{display:flex;gap:4px;margin-top:10px}
.tab{padding:9px 18px;border:1px solid var(--border);border-bottom:none;border-radius:4px 4px 0 0;background:var(--bg2);color:var(--text2);font-family:var(--mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:.12s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent);background:var(--bg3);border-color:var(--border2);font-weight:600}
/* table */
.panel{background:var(--bg2);border:1px solid var(--border2);border-radius:0 4px 4px 4px;overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{position:sticky;top:0;padding:8px 10px;text-align:right;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);background:var(--bg3);border-bottom:1px solid var(--border2);white-space:nowrap;cursor:pointer;user-select:none}
thead th:first-child,thead th.l{text-align:left}
thead th:hover{color:var(--text)}
thead th .ar{color:var(--accent);font-size:8px}
tbody tr.grp{border-bottom:1px solid rgba(28,37,53,.6);cursor:pointer;transition:background .1s}
tbody tr.grp:hover{background:rgba(0,200,255,.04)}
tbody tr.grp.open{background:rgba(0,200,255,.06)}
td{padding:6px 10px;text-align:right;white-space:nowrap}
td:first-child,td.l{text-align:left}
.gname{color:var(--text);font-weight:500}
.gname .arr{display:inline-block;width:12px;color:var(--text3);transition:transform .15s}
tr.open .gname .arr{transform:rotate(90deg);color:var(--accent)}
.cnt{color:var(--text3);font-size:10px}
.sym{color:var(--accent);font-weight:500}
.muted{color:var(--text3)}
.nh{color:var(--green);font-weight:600}
.nl{color:var(--red);font-weight:600}
.zero{color:var(--text3)}
/* detail */
tr.detail{display:none}
tr.detail.show{display:table-row}
tr.detail > td{padding:0;background:var(--bg4)}
.sub{width:100%;border-collapse:collapse}
.sub th{padding:5px 10px;font-size:8.5px;letter-spacing:1px;color:var(--text3);text-align:right;text-transform:uppercase;border-bottom:1px solid var(--border)}
.sub th:first-child{text-align:left;padding-left:30px}
.sub td{padding:4px 10px;font-size:11px;border-bottom:1px solid rgba(28,37,53,.35)}
.sub td:first-child{padding-left:30px}
.sub tr:last-child td{border-bottom:none}
.flag-nh{background:rgba(0,230,118,.14);color:var(--green);padding:1px 6px;border-radius:2px;font-size:9px;letter-spacing:.5px}
.flag-nl{background:rgba(255,51,85,.14);color:var(--red);padding:1px 6px;border-radius:2px;font-size:9px;letter-spacing:.5px}
.tklist{padding:10px 14px 12px 30px;line-height:1.9}
.tklist .t{display:inline-block;margin-right:8px;font-size:11px}
.foot{margin-top:10px;font-size:9.5px;color:var(--text3);letter-spacing:.5px;display:flex;gap:6px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block}
@media(max-width:760px){ .tab{padding:8px 11px;font-size:10px} }
/* live clock */
.clock{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:13px;font-weight:500;color:var(--text);letter-spacing:1px;padding:4px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:2px}
.cdot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
/* clickable / hoverable tickers */
.tk{cursor:pointer;border-bottom:1px dotted rgba(114,146,176,.4);transition:color .12s}
.tk:hover{color:var(--accent)!important;border-bottom-color:var(--accent)}
/* TradingView chart modal */
#tvm{display:none;position:fixed;inset:0;z-index:9990;background:rgba(0,0,0,.82);align-items:center;justify-content:center}
#tvm.on{display:flex}
.tvm-box{width:min(1040px,95vw);height:min(660px,90vh);background:var(--bg);border:1px solid var(--border2);border-radius:6px;display:flex;flex-direction:column;overflow:hidden}
.tvm-hdr{display:flex;align-items:center;padding:9px 12px;background:var(--bg2);border-bottom:1px solid var(--border);gap:10px}
#tvm-title{flex:1;color:var(--accent);letter-spacing:1.5px;font-size:13px;font-weight:600}
.tvm-hdr button{background:none;border:1px solid var(--border2);color:var(--text3);font-family:var(--mono);font-size:10px;letter-spacing:1px;padding:5px 10px;border-radius:3px;cursor:pointer}
.tvm-hdr button:hover{border-color:var(--red);color:var(--red)}
#tvm-frame{flex:1;border:0;width:100%}
/* Finviz hover preview */
#hoverChart{display:none;position:fixed;z-index:9980;background:var(--bg);border:1px solid var(--border2);border-radius:6px;padding:6px;box-shadow:0 10px 34px rgba(0,0,0,.6);pointer-events:none}
#hoverChart img{display:block;width:348px;height:auto;border-radius:3px;min-height:60px}
#hoverChart .hb{font-size:9px;color:var(--accent);letter-spacing:1.5px;padding:2px 4px 4px}
/* Market Monitor */
.m-dist{font-size:10px;color:var(--text3);letter-spacing:.4px;padding:9px 12px;border-bottom:1px solid var(--border2);line-height:1.7}
.m-dist b{color:var(--text)}
.mtab{font-size:11px;white-space:nowrap}
.mtab th.grp{text-align:center;letter-spacing:1px;border-left:1px solid var(--border2);font-size:9px}
.mtab th.gh-prim{color:var(--amber);background:rgba(255,179,0,.08)}
.mtab th.gh-sec{color:var(--green);background:rgba(0,230,118,.06)}
.mtab td{text-align:right;padding:5px 8px;font-variant-numeric:tabular-nums}
.mtab td.date{text-align:left;color:var(--text2);position:sticky;left:0;background:var(--bg2)}
.m-gl{background:#bfe8c6;color:#0c2a14}
.m-gd{background:#2ec540;color:#04210a;font-weight:600}
.m-rl{background:#f4b6bf;color:#2a0a11}
.m-rd{background:#f0303a;color:#2a0408;font-weight:600}
.mctl{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border2)}
.mctl select{font-family:var(--mono);font-size:11px;background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:3px;padding:4px 8px}
.mctl label{font-size:9px;letter-spacing:1px;color:var(--text3);text-transform:uppercase}
.mcell.exp{cursor:pointer}
.mdetail{display:none}
.mdetail.show{display:table-row}
.mdetail>td{background:var(--bg4);padding:0}
.copybtn{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--accent);background:var(--bg3);border:1px solid var(--border2);border-radius:3px;padding:3px 9px;cursor:pointer}
.copybtn:hover{background:var(--adim)}
</style>
</head>

// ---- formatters ---------------------------------------------------------
function fpct(v){ if(v==null) return '<span class="zero">—</span>';
  const s=v>0?'+':''; const c=v>0?'var(--green)':v<0?'var(--red)':'var(--text3)';
  return `<span style="color:${c}">${s}${v.toFixed(2)}%</span>`; }
function heat(v,max){ if(v==null) return '';
  const a=Math.min(Math.abs(v)/max,1)*0.4;
  return v>0?`background:rgba(0,230,118,${a.toFixed(3)})`
            :v<0?`background:rgba(255,51,85,${a.toFixed(3)})`:''; }
function fvol(v){ if(v==null) return '—'; v=+v;
  if(v>=1e9) return '$'+(v/1e9).toFixed(1)+'B';
  if(v>=1e6) return '$'+(v/1e6).toFixed(0)+'M';
  if(v>=1e3) return '$'+(v/1e3).toFixed(0)+'K'; return '$'+v.toFixed(0); }
function fprice(v){ return v==null?'—':v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

// ---- sorting ------------------------------------------------------------
function sortRows(rows,cols,tabId){
  const st=SORT[tabId]; if(!st) return rows;
  const col=cols.find(c=>c.k===st.col); if(!col) return rows;
  const num = col.type!=='text';
  return [...rows].sort((a,b)=>{
    let x=a[st.col], y=b[st.col];
    if(num){ x=x==null?-1e18:x; y=y==null?-1e18:y; return st.dir*(y-x); }
    x=(''+x).toUpperCase(); y=(''+y).toUpperCase();
    return st.dir*(x<y?1:x>y?-1:0);
  });
}
function headerRow(cols,tabId){
  const st=SORT[tabId]||{};
  return '<tr>'+cols.map(c=>{
    const cls=c.type==='text'?'l':'';
    const ar=st.col===c.k?`<span class="ar">${st.dir<0?'▼':'▲'}</span>`:'';
    return `<th class="${cls}" data-col="${c.k}" data-tab="${tabId}">${c.label} ${ar}</th>`;
  }).join('')+'</tr>';
}

  rows.forEach((r,i)=>{
    html+=`<tr class="grp" data-i="${i}">`;
    GROUP_COLS.forEach(c=>{
      if(c.k==='name') html+=`<td class="l gname"><span class="arr">▸</span> ${r.name}</td>`;
      else if(c.k==='count') html+=`<td class="cnt">${r.count}</td>`;
      else if(c.type==='pct') html+=perfCell(r[c.k],c);
      else if(c.k==='new_highs') html+=`<td class="${r.new_highs?'nh':'zero'}">${r.new_highs||'—'}</td>`;
      else if(c.k==='new_lows') html+=`<td class="${r.new_lows?'nl':'zero'}">${r.new_lows||'—'}</td>`;
    });
    html+=`</tr><tr class="detail"><td colspan="${GROUP_COLS.length}"><div id="det${i}"></div></td></tr>`;
  });
  return html;
}
function stockSubTable(members){
  const rows=sortRows(members,STOCK_COLS,'_sub'+ACTIVE);
  const syms=rows.map(m=>m.sym);
  let h=`<div style="padding:7px 12px 7px 30px"><button class="copybtn" onclick='copyTickers(${JSON.stringify(syms)},this)'>COPY ${syms.length} TICKERS</button></div>`;
  h+='<table class="sub"><thead>'+headerRow(STOCK_COLS,'_sub'+ACTIVE)+'</thead><tbody>';
  rows.forEach(m=>{
    h+='<tr>';
    STOCK_COLS.forEach(c=>{
      if(c.k==='sym') h+=`<td class="l"><span class="tk sym" data-sym="${m.sym}">${m.sym}</span></td>`;
      else if(c.k==='dollar_vol') h+=`<td class="muted">${fvol(m.dollar_vol)}</td>`;
      else if(c.k==='adr') h+=`<td class="muted">${m.adr==null?'—':m.adr.toFixed(1)}</td>`;
      else if(c.type==='pct') h+=perfCell(m[c.k],c);
      else if(c.k==='flag') h+=`<td>${m.new_high?'<span class="flag-nh">NH</span>':m.new_low?'<span class="flag-nl">NL</span>':'<span class="zero">·</span>'}</td>`;
    });
    h+='</tr>';
  });
  return h+'</tbody></table>';
}
function etfCols(){
  return ETF_COLS.map(c=> c.k==='name'
    ? {...c, label: ACTIVE==='country' ? 'Country' : 'Name'} : c);
}
function etfRows(rows,cols){
  return sortRows(rows,cols,ACTIVE).map(r=>{
    let h='<tr class="grp" style="cursor:default">';
    cols.forEach(c=>{
      if(c.k==='sym') h+=`<td class="l"><span class="tk sym" data-sym="${r.sym}">${r.sym}</span></td>`;
      else if(c.k==='name') h+=`<td class="l" style="color:var(--text2)">${r.name||''}</td>`;
      else if(c.k==='price') h+=`<td>${fprice(r.price)}</td>`;
      else h+=perfCell(r[c.k],c);
    });
    return h+'</tr>';
  }).join('');
}
function nhlView(){
  const rows=(DATA.new_high_low.by_industry||[]).map(r=>({...r,net:r.new_highs-r.new_lows}));
  const cols=[{k:'industry',label:'Industry',type:'text'},
    {k:'new_highs',label:'New Highs',type:'int'},{k:'new_lows',label:'New Lows',type:'int'},
    {k:'net',label:'Net',type:'int'}];
  if(!SORT['nhl']) SORT['nhl']={col:'net',dir:-1};
  const t=DATA.new_high_low.totals||{new_highs:0,new_lows:0};
  let h=`<div style="padding:10px 14px;border-bottom:1px solid var(--border2);font-size:11px">
    <span class="nh">${t.new_highs} new highs</span> &nbsp;·&nbsp; <span class="nl">${t.new_lows} new lows</span>
    &nbsp;·&nbsp; <span class="muted">net ${t.new_highs-t.new_lows>=0?'+':''}${t.new_highs-t.new_lows}</span></div>`;
  h+='<table><thead>'+headerRow(cols,'nhl')+'</thead><tbody>';
  sortRows(rows,cols,'nhl').forEach((r,i)=>{
    h+=`<tr class="grp" data-nhl="${i}"><td class="l gname"><span class="arr">▸</span> ${r.industry}</td>
      <td class="${r.new_highs?'nh':'zero'}">${r.new_highs||'—'}</td>
      <td class="${r.new_lows?'nl':'zero'}">${r.new_lows||'—'}</td>
      <td style="color:${r.net>0?'var(--green)':r.net<0?'var(--red)':'var(--text3)'}">${r.net>0?'+':''}${r.net}</td></tr>`;
    h+=`<tr class="detail"><td colspan="4"><div class="tklist">
      ${r.nh_tickers.map(s=>`<span class="t"><span class="flag-nh">▲</span> <b class="tk sym" data-sym="${s}">${s}</b></span>`).join('')}
      ${r.nl_tickers.map(s=>`<span class="t"><span class="flag-nl">▼</span> <b class="tk" data-sym="${s}" style="color:var(--red)">${s}</b></span>`).join('')}
      ${(!r.nh_tickers.length&&!r.nl_tickers.length)?'<span class="muted">—</span>':''}
    </div></td></tr>`;
  });
  return h+'</tbody></table>';
}

// ---- render -------------------------------------------------------------
function render(){
  // tabs
  document.getElementById('tabs').innerHTML=TABS.map(t=>
    `<div class="tab ${t.id===ACTIVE?'on':''}" data-tab="${t.id}">${t.label}</div>`).join('');
  const tab=TABS.find(t=>t.id===ACTIVE);
  const view=document.getElementById('view');

  if(tab.kind==='monitor'){ renderMonitor(); return; }
  if(tab.kind==='nhl'){ view.innerHTML=nhlView(); bindNhl(); return; }

  if(tab.kind==='etf'){
    const cols=etfCols();
    view.innerHTML='<table><thead>'+headerRow(cols,ACTIVE)+'</thead><tbody>'+etfRows(tab.src(DATA),cols)+'</tbody></table>';
    bindSort(); return;
  }
  // group
  if(!SORT[ACTIVE]) SORT[ACTIVE]={col:'m1',dir:-1};
  const rows=sortRows(tab.src(DATA),GROUP_COLS,ACTIVE);
  view.innerHTML='<table><thead>'+headerRow(GROUP_COLS,ACTIVE)+'</thead><tbody>'+groupRows(rows,tab)+'</tbody></table>';
  bindSort();
  bindGroupDrill(rows,tab);
}
function bindSort(){
  document.querySelectorAll('thead th[data-col]').forEach(th=>{
    th.onclick=()=>{ const tabId=th.dataset.tab, col=th.dataset.col;
      const st=SORT[tabId]||{col:null,dir:-1};
      SORT[tabId]= st.col===col?{col,dir:-st.dir}:{col,dir:-1};
      if(tabId.startsWith('_sub')) reRenderOpenDetails(); else render();
    };
  });
}
let OPEN=new Set();
function bindGroupDrill(rows,tab){
  OPEN=new Set();
  document.querySelectorAll('tr.grp[data-i]').forEach(tr=>{
    tr.onclick=()=>{
      const i=+tr.dataset.i, det=tr.nextElementSibling;
      const open=det.classList.toggle('show'); tr.classList.toggle('open',open);
      if(open){ OPEN.add(i);
        const key=tab.drill, val=rows[i].name;
        const members=Object.entries(DATA.tickers)
          .filter(([s,m])=>m[key]===val).map(([s,m])=>({sym:s,...m}));
        document.getElementById('det'+i).innerHTML=stockSubTable(members);
        bindSort();
      } else OPEN.delete(i);
    };
  });
}
function reRenderOpenDetails(){ const tab=TABS.find(t=>t.id===ACTIVE);
  const rows=sortRows(tab.src(DATA),GROUP_COLS,ACTIVE);
  OPEN.forEach(i=>{ const key=tab.drill,val=rows[i]?.name; if(val==null)return;
    const members=Object.entries(DATA.tickers).filter(([s,m])=>m[key]===val).map(([s,m])=>({sym:s,...m}));
    const el=document.getElementById('det'+i); if(el){el.innerHTML=stockSubTable(members);bindSort();}
  });
}
function bindNhl(){
  document.querySelectorAll('tr.grp[data-nhl]').forEach(tr=>{
    tr.onclick=()=>{ const det=tr.nextElementSibling; const o=det.classList.toggle('show'); tr.classList.toggle('open',o); };
  });
  bindSort();
}
function bindTabs(){
  document.getElementById('tabs').onclick=e=>{ const t=e.target.closest('.tab'); if(!t)return;
    ACTIVE=t.dataset.tab; render(); };
}

// ---- gainers + badges ---------------------------------------------------
function renderChrome(){
  document.getElementById('tape').innerHTML=(DATA.top_gainers||[]).map(g=>
    `<span class="chip"><b class="tk" data-sym="${g.sym}">${g.sym}</b> ${fpct(g.pct)}</span>`).join('') || '<span class="muted">—</span>';
  document.getElementById('uniBadge').textContent=(DATA.universe_size||0)+' names';
  const dt=DATA.generated_at?new Date(DATA.generated_at):null;
  if(dt){ const o={month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'};
    document.getElementById('asofBadge').textContent='DATA: '+dt.toLocaleString('en-US',o); }
}
function boot(data,live){
  DATA=data; renderChrome();
  const b=document.getElementById('srcBadge');
  if(live){ b.textContent='● LIVE'; b.className='badge live'; }
  else{ b.textContent='● SAMPLE DATA'; b.className='badge demo';
    document.getElementById('footNote').textContent='Showing sample data — data/data.json not found yet. It appears once your GitHub Action runs.'; }
  bindTabs(); startClock(); bindTickers(); render();
}

// ---- live clock (your computer's local time) ----------------------------
function startClock(){
  const el=document.getElementById('clockTime');
  const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const tick=()=>{ const d=new Date();
    el.textContent=WD[d.getDay()]+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}); };
  tick(); setInterval(tick,1000);
}

// ---- ticker charts: click = TradingView modal, hover = Finviz preview ----
function tvURL(sym){
  const studies=encodeURIComponent(JSON.stringify([
    {id:"MAExp@tv-basicstudies",inputs:{length:10}},
    {id:"MAExp@tv-basicstudies",inputs:{length:20}},
    {id:"MAExp@tv-basicstudies",inputs:{length:50}}]));
  return 'https://s.tradingview.com/widgetembed/?symbol='+encodeURIComponent(sym)
    +'&interval=D&theme=dark&style=1&hidesidetoolbar=0&withdateranges=1'
    +'&timezone=exchange&studies='+studies+'&locale=en';
}
let currentSym=null, chartList=[], chartIdx=-1;
function openTv(sym){
  hideHover(); currentSym=sym;
  document.getElementById('tvm-title').textContent=sym+'  ·  daily · 10/20/50 EMA';
  document.getElementById('tvm-frame').src=tvURL(sym);
  document.getElementById('tvm').classList.add('on');
  document.body.style.overflow='hidden';
}
function openChartFrom(el){
  // build a navigation list from the nearest table / tape so ←/→ step through it
  const scope = el.closest('table') || el.closest('.tape-scroll') || document;
  const nodes = [...scope.querySelectorAll('.tk')];
  chartList = nodes.map(n=>n.dataset.sym);
  chartIdx  = nodes.indexOf(el);
  openTv(el.dataset.sym);
}
function stepChart(delta){
  if(!chartList.length || chartIdx<0) return;
  chartIdx = Math.max(0, Math.min(chartList.length-1, chartIdx+delta));
  openTv(chartList[chartIdx]);
}
function openNews(){ if(currentSym) window.open('https://finviz.com/quote.ashx?t='+encodeURIComponent(currentSym),'_blank','noopener'); }
function openFilings(){ if(currentSym) window.open('https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&ticker='+encodeURIComponent(currentSym)+'&type=&dateb=&owner=include&count=40','_blank','noopener'); }
function copyTickers(syms,btn){
  navigator.clipboard.writeText(syms.join(', ')).then(()=>{
    const o=btn.textContent; btn.textContent='COPIED ✓'; setTimeout(()=>btn.textContent=o,1200);
  }).catch(()=>{ btn.textContent='COPY FAILED'; });
}
function closeTv(){
  document.getElementById('tvm').classList.remove('on');
  document.getElementById('tvm-frame').src='';
  document.body.style.overflow='';
}
function showHover(el){
  const sym=el.dataset.sym; if(!sym) return;
  const box=document.getElementById('hoverChart');
  document.getElementById('hoverSym').textContent=sym;
  document.getElementById('hoverImg').src='https://finviz.com/chart.ashx?t='+encodeURIComponent(sym)+'&ty=c&ta=1&p=d&s=l&_='+Date.now();
  const r=el.getBoundingClientRect(), W=362, H=236;
  let left=r.right+12; if(left+W>innerWidth) left=r.left-W-12;
  let top=r.top; if(top+H>innerHeight) top=innerHeight-H-8;
  box.style.left=Math.max(8,left)+'px'; box.style.top=Math.max(8,top)+'px';
  box.style.display='block';
}
function hideHover(){ document.getElementById('hoverChart').style.display='none'; }
function bindTickers(){
  document.addEventListener('click',e=>{ const t=e.target.closest('.tk'); if(t){ e.stopPropagation(); openChartFrom(t);} });
  document.addEventListener('mouseover',e=>{ const t=e.target.closest('.tk'); if(t) showHover(t); });
  document.addEventListener('mouseout',e=>{ const t=e.target.closest('.tk'); if(t) hideHover(); });
  window.addEventListener('scroll',hideHover,true);
  document.addEventListener('keydown',e=>{
    const open=document.getElementById('tvm').classList.contains('on');
    if(e.key==='Escape') closeTv();
    else if(open && e.key==='ArrowRight'){ e.preventDefault(); stepChart(1); }
    else if(open && e.key==='ArrowLeft'){ e.preventDefault(); stepChart(-1); }
  });
}

// ---- Market Monitor -----------------------------------------------------
function monColors(r, big){
  const c={};
  if(r.up4>=big) c.up4='m-gd'; else if(r.up4>r.dn4) c.up4='m-gl';
  if(r.dn4>=big) c.dn4='m-rd'; else if(r.dn4>r.up4) c.dn4='m-rl';
  c.r5  = r.r5==null ? '' : (r.r5>=2?'m-gd':r.r5<0.5?'m-rd':'');
  c.r10 = r.r10==null? '' : (r.r10>=2?'m-gd':r.r10<0.5?'m-rd':'');
  const pair=(ku,kd)=>{ if(r[ku]>r[kd]){c[ku]='m-gd';c[kd]='m-gd';} else if(r[kd]>r[ku]){c[ku]='m-rd';c[kd]='m-rd';} };
  pair('up25q','dn25q'); pair('up25m','dn25m'); pair('up13','dn13');
  if(r.up50m>=30) c.up50m='m-gd';
  if(r.dn50m>=30) c.dn50m='m-rd';
  return c;
}
function nameList(kind, syms){
  const col=kind==='up4'?'var(--green)':'var(--red)', arr=kind==='up4'?'▲':'▼';
  const chips=syms.map(s=>`<span class="t"><span style="color:${col}">${arr}</span> <b class="tk" data-sym="${s}">${s}</b></span>`).join(' ');
  const title=kind==='up4'?'UP 4% TODAY':'DOWN 4% TODAY';
  return `<div class="tklist"><div style="display:flex;align-items:center;gap:10px;margin-bottom:5px">`
    +`<span class="h-title">${title} · ${syms.length}</span>`
    +`<button class="copybtn" onclick='copyTickers(${JSON.stringify(syms)},this)'>COPY</button></div>`
    +(chips||'<span class="muted">—</span>')+`</div>`;
}
let MON_YEAR=null;
function exportMonitorCSV(){
  const D=MDATA||MONITOR_SAMPLE;
  const yr=MON_YEAR, rws=(D.rows||[]).filter(r=>r.date.startsWith(yr));
  const cols=['date','up4','dn4','r5','r10','up25q','dn25q','up25m','dn25m','up50m','dn50m','up13','dn13','atr10x','pct50','universe','spx'];
  const head=['Date','Up4%','Dn4%','5D Ratio','10D Ratio','Up25%Q','Dn25%Q','Up25%M','Dn25%M','Up50%M','Dn50%M','Up13%34','Dn13%34','10xATR','>50dma','Universe','S&P'];
  const lines=[head.join(',')];
  rws.forEach(r=>lines.push(cols.map(k=>r[k]==null?'':r[k]).join(',')));
  const blob=new Blob([lines.join('\n')],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='market-monitor-'+yr+'.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function renderMonitor(){
  const D = MDATA || MONITOR_SAMPLE;
  const allRows=D.rows||[], big=D.big_day||300;
  const years=[...new Set(allRows.map(r=>r.date.slice(0,4)))].sort().reverse();
  if(!MON_YEAR || !years.includes(MON_YEAR)) MON_YEAR = years[0];
  const rows=allRows.filter(r=>r.date.startsWith(MON_YEAR));
  const du=(D.distribution&&D.distribution.up4)||{}, dd=(D.distribution&&D.distribution.dn4)||{};
  let html=`<div class="m-dist">Universe ~<b>${D.universe_size||'—'}</b> liquid names · `
    +`<b>Up-4%</b> day — median <b>${du.median??'—'}</b>, top-5% <b>${du.p95??'—'}</b>, max <b>${du.max??'—'}</b> &nbsp;·&nbsp; `
    +`<b>Down-4%</b> — median <b>${dd.median??'—'}</b>, top-5% <b>${dd.p95??'—'}</b>, max <b>${dd.max??'—'}</b> &nbsp;·&nbsp; `
    +`dark-green "big day" line at <b>${big}</b></div>`;
  html+=`<div class="mctl"><label>Year</label><select id="monYear">`
    +years.map(y=>`<option${y===MON_YEAR?' selected':''}>${y}</option>`).join('')
    +`</select><button class="copybtn" onclick="exportMonitorCSV()">EXPORT ${MON_YEAR} → CSV</button>`
    +`<span style="font-size:9px;color:var(--text3);margin-left:auto">${rows.length} days</span></div>`;
  html+='<div class="scroll"><table class="mtab"><thead>'
    +'<tr><th class="date"></th><th class="grp gh-prim" colspan="4">Primary Breadth</th>'
    +'<th class="grp gh-sec" colspan="8">Secondary Breadth</th>'
    +'<th class="grp" colspan="4">Extension / Context</th></tr>'
    +'<tr><th class="date l">Date</th>'
    +'<th>Up 4%</th><th>Dn 4%</th><th>5D R</th><th>10D R</th>'
    +'<th>Up25%Q</th><th>Dn25%Q</th><th>Up25%M</th><th>Dn25%M</th><th>Up50%M</th><th>Dn50%M</th><th>Up13%34</th><th>Dn13%34</th>'
    +'<th>10×ATR</th><th>&gt;50dma</th><th>Univ</th><th>S&amp;P</th></tr></thead><tbody>';
  rows.forEach((r,ri)=>{
    const c=monColors(r,big), latest=(r===allRows[0]);
    const cl=k=>c[k]?` class="${c[k]}"`:'';
    const num=v=>v==null?'—':v;
    const up4 = latest ? `<td class="${c.up4||''} mcell exp" data-mx="up4">${r.up4} ▾</td>` : `<td${cl('up4')}>${r.up4}</td>`;
    const dn4 = latest ? `<td class="${c.dn4||''} mcell exp" data-mx="dn4">${r.dn4} ▾</td>` : `<td${cl('dn4')}>${r.dn4}</td>`;
    html+=`<tr><td class="date l">${r.date}</td>${up4}${dn4}`
      +`<td${cl('r5')}>${r.r5==null?'—':r.r5.toFixed(2)}</td><td${cl('r10')}>${r.r10==null?'—':r.r10.toFixed(2)}</td>`
      +`<td${cl('up25q')}>${num(r.up25q)}</td><td${cl('dn25q')}>${num(r.dn25q)}</td>`
      +`<td${cl('up25m')}>${num(r.up25m)}</td><td${cl('dn25m')}>${num(r.dn25m)}</td>`
      +`<td${cl('up50m')}>${num(r.up50m)}</td><td${cl('dn50m')}>${num(r.dn50m)}</td>`
      +`<td${cl('up13')}>${num(r.up13)}</td><td${cl('dn13')}>${num(r.dn13)}</td>`
      +`<td>${num(r.atr10x)}</td><td>${r.pct50==null?'—':r.pct50.toFixed(1)+'%'}</td>`
      +`<td class="muted">${num(r.universe)}</td><td>${r.spx==null?'—':r.spx.toLocaleString()}</td></tr>`;
    if(latest){
      const tm=D.today_members||{};
      html+=`<tr class="mdetail" id="mdet-up4"><td colspan="17">${nameList('up4',tm.up4||[])}</td></tr>`;
      html+=`<tr class="mdetail" id="mdet-dn4"><td colspan="17">${nameList('dn4',tm.dn4||[])}</td></tr>`;
    }
  });
  html+='</tbody></table></div>';
  document.getElementById('view').innerHTML=html;
  document.querySelectorAll('.mcell.exp').forEach(td=>{
    td.onclick=()=>{ const el=document.getElementById('mdet-'+td.dataset.mx); if(el) el.classList.toggle('show'); };
  });
  const ys=document.getElementById('monYear'); if(ys) ys.onchange=()=>{ MON_YEAR=ys.value; render(); };
}

fetch('data/data.json?_='+Date.now())
  .then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(d=>boot(d,true))
  .catch(()=>boot(SAMPLE,false));

// Market Monitor data loads independently (its own pipeline / file)
fetch('data/monitor.json?_='+Date.now())
  .then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(d=>{ MDATA=d; if(ACTIVE==='monitor') render(); })
  .catch(()=>{ MDATA = MONITOR_SAMPLE; if(ACTIVE==='monitor') render(); });
</script>
