<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090d; --bg2:#0c0f15; --bg3:#111520; --bg4:#161b26;
  --border:#1c2535; --border2:#243044;
  --accent:#00c8ff; --green:#00e676; --red:#ff3355; --amber:#ffb300;
  --text:#c8d8ea; --text2:#7292b0; --text3:#3d5a78;
  --mono:'IBM Plex Mono',monospace; --sans:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:12px;padding:14px}
.wrap{max-width:1680px;margin:0 auto}
/* header */
.hdr{display:flex;align-items:center;gap:16px;padding:12px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;position:relative;overflow:hidden}
.hdr::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent) 40%,var(--green) 70%,transparent)}
.logo{font-size:17px;font-weight:600;letter-spacing:3px;color:var(--accent)}
.logo em{color:var(--text3);font-style:normal}
.badge{font-size:9px;letter-spacing:1px;padding:4px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:2px;color:var(--text2)}
.badge.live{color:var(--green);border-color:rgba(0,230,118,.3)}
.badge.demo{color:var(--amber);border-color:rgba(255,179,0,.3)}
.spacer{margin-left:auto}
/* gainers tape */
.tape{display:flex;align-items:center;gap:0;margin-top:8px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;overflow:hidden}
.tape-lbl{flex:none;padding:8px 12px;font-size:9px;letter-spacing:1.5px;color:var(--text3);background:var(--bg3);border-right:1px solid var(--border)}
.tape-scroll{display:flex;gap:18px;padding:8px 14px;overflow-x:auto;white-space:nowrap}
.tape-scroll::-webkit-scrollbar{height:0}
.chip{font-size:11px}
.chip b{color:var(--text)}
/* tabs */
.tabs{display:flex;gap:4px;margin-top:10px}
.tab{padding:9px 18px;border:1px solid var(--border);border-bottom:none;border-radius:4px 4px 0 0;background:var(--bg2);color:var(--text2);font-family:var(--mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:.12s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent);background:var(--bg3);border-color:var(--border2);font-weight:600}
/* table */
.panel{background:var(--bg2);border:1px solid var(--border2);border-radius:0 4px 4px 4px;overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{position:sticky;top:0;padding:8px 10px;text-align:right;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);background:var(--bg3);border-bottom:1px solid var(--border2);white-space:nowrap;cursor:pointer;user-select:none}
thead th:first-child,thead th.l{text-align:left}
thead th:hover{color:var(--text)}
thead th .ar{color:var(--accent);font-size:8px}
tbody tr.grp{border-bottom:1px solid rgba(28,37,53,.6);cursor:pointer;transition:background .1s}
tbody tr.grp:hover{background:rgba(0,200,255,.04)}
tbody tr.grp.open{background:rgba(0,200,255,.06)}
td{padding:6px 10px;text-align:right;white-space:nowrap}
td:first-child,td.l{text-align:left}
.gname{color:#f4f8fc;font-weight:600}
.gname .arr{display:inline-block;width:12px;color:var(--text3);transition:transform .15s}
tr.open .gname .arr{transform:rotate(90deg);color:var(--accent)}
.cnt{color:var(--text3);font-size:10px}
.sym{color:var(--accent);font-weight:500}
.muted{color:var(--text3)}
.nh{color:var(--green);font-weight:600}
.nl{color:var(--red);font-weight:600}
.zero{color:var(--text3)}
/* detail */
tr.detail{display:none}
tr.detail.show{display:table-row}
tr.detail > td{padding:0;background:var(--bg4)}
.sub{width:100%;border-collapse:collapse}
.sub th{padding:5px 10px;font-size:8.5px;letter-spacing:1px;color:var(--text3);text-align:right;text-transform:uppercase;border-bottom:1px solid var(--border)}
.sub th:first-child{text-align:left;padding-left:30px}
.sub td{padding:4px 10px;font-size:11px;border-bottom:1px solid rgba(28,37,53,.35)}
.sub td:first-child{padding-left:30px}
.sub tr:last-child td{border-bottom:none}
.flag-nh{background:rgba(0,230,118,.14);color:var(--green);padding:1px 6px;border-radius:2px;font-size:9px;letter-spacing:.5px}
.flag-nl{background:rgba(255,51,85,.14);color:var(--red);padding:1px 6px;border-radius:2px;font-size:9px;letter-spacing:.5px}
.tklist{padding:10px 14px 12px 30px;line-height:1.9}
.tklist .t{display:inline-block;margin-right:8px;font-size:11px}
.foot{margin-top:10px;font-size:9.5px;color:var(--text3);letter-spacing:.5px;display:flex;gap:6px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block}
@media(max-width:760px){ .tab{padding:8px 11px;font-size:10px} }
/* module dropdown */
.hdr{overflow:visible}
.mod-dd{position:relative}
.mod-btn{display:flex;align-items:center;gap:9px;background:var(--bg3);border:1px solid var(--border2);border-radius:5px;padding:9px 14px;color:var(--text);font-family:var(--sans);font-size:15px;font-weight:600;cursor:pointer;letter-spacing:.3px}
.mod-btn:hover{border-color:var(--accent)}
.mod-ic{color:var(--accent);font-size:13px}
.mod-btn .caret{color:var(--text3);font-size:10px}
.mod-menu{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:200;background:var(--bg2);border:1px solid var(--border2);border-radius:6px;min-width:215px;box-shadow:0 14px 36px rgba(0,0,0,.6);overflow:hidden}
.mod-menu.on{display:block}
.mod-item{padding:11px 16px;font-family:var(--sans);font-size:13px;color:var(--text2);cursor:pointer;border-left:2px solid transparent}
.mod-item:hover{background:var(--bg3);color:var(--text)}
.mod-item.on{color:var(--accent);border-left-color:var(--accent);background:rgba(0,200,255,.06)}
/* movers marquee */
.tape{overflow:hidden}
.tape-lbl{z-index:2}
.marquee{display:inline-flex;gap:26px;white-space:nowrap;animation:scroll 80s linear infinite;will-change:transform;padding:8px 14px}
.tape:hover .marquee{animation-play-state:paused}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* grid mini-charts overlay */
.gridm{display:none;position:fixed;inset:0;z-index:9995;background:var(--bg);flex-direction:column}
.gridm.on{display:flex}
.gridm-hdr{display:flex;align-items:center;gap:12px;padding:11px 16px;background:var(--bg2);border-bottom:1px solid var(--border2);flex-wrap:wrap}
#gridm-title{font-family:var(--sans);font-weight:600;font-size:14px;color:var(--accent)}
.gridm-tf{display:flex;gap:4px}
.gtf{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--text2);background:var(--bg3);border:1px solid var(--border2);border-radius:3px;padding:5px 10px;cursor:pointer}
.gtf.on{color:var(--accent);border-color:var(--accent)}
.gridm-hdr>button.gclose{margin-left:auto;background:none;border:1px solid var(--border2);color:var(--text3);font-family:var(--mono);font-size:10px;letter-spacing:1px;padding:6px 11px;border-radius:3px;cursor:pointer}
.gridm-hdr>button.gclose:hover{border-color:var(--red);color:var(--red)}
.gridm-body{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(336px,1fr));gap:10px;padding:12px}
.gcell{background:var(--bg2);border:1px solid var(--border);border-radius:6px;overflow:hidden;height:280px;display:flex;flex-direction:column}
.gcell-h{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--border)}
.gcell-h b{color:var(--accent);font-family:var(--mono);font-size:12px;cursor:pointer}
.gexp{color:var(--text3);cursor:pointer;font-size:13px}
.gexp:hover{color:var(--accent)}
.gcell iframe{flex:1;border:0;width:100%}
.chartsbtn{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--amber);background:var(--bg3);border:1px solid var(--border2);border-radius:3px;padding:3px 9px;cursor:pointer;margin-left:8px}
.chartsbtn:hover{border-color:var(--amber)}
/* live clock */
.clock{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:13px;font-weight:500;color:var(--text);letter-spacing:1px;padding:4px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:2px}
.cdot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
/* clickable / hoverable tickers */
.tk{cursor:pointer;border-bottom:1px dotted rgba(114,146,176,.4);transition:color .12s}
.tk:hover{color:var(--accent)!important;border-bottom-color:var(--accent)}
/* TradingView chart modal */
#tvm{display:none;position:fixed;inset:0;z-index:9990;background:rgba(0,0,0,.82);align-items:center;justify-content:center}
#tvm.on{display:flex}
.tvm-box{width:min(1040px,95vw);height:min(660px,90vh);background:var(--bg);border:1px solid var(--border2);border-radius:6px;display:flex;flex-direction:column;overflow:hidden}
.tvm-hdr{display:flex;align-items:center;padding:9px 12px;background:var(--bg2);border-bottom:1px solid var(--border);gap:10px}
#tvm-title{flex:1;color:var(--accent);letter-spacing:1.5px;font-size:13px;font-weight:600}
.tvm-hdr button{background:none;border:1px solid var(--border2);color:var(--text3);font-family:var(--mono);font-size:10px;letter-spacing:1px;padding:5px 10px;border-radius:3px;cursor:pointer}
.tvm-hdr button:hover{border-color:var(--red);color:var(--red)}
#tvm-frame{flex:1;border:0;width:100%}
/* Finviz hover preview */
#hoverChart{display:none;position:fixed;z-index:9980;background:var(--bg);border:1px solid var(--border2);border-radius:6px;padding:6px;box-shadow:0 10px 34px rgba(0,0,0,.6);pointer-events:none}
#hoverChart img{display:block;width:348px;height:auto;border-radius:3px;min-height:60px}
#hoverChart .hb{font-size:9px;color:var(--accent);letter-spacing:1.5px;padding:2px 4px 4px}
/* Market Monitor */
.mtab{font-family:var(--sans);font-size:12px;white-space:nowrap}
.mtab thead th{padding:6px 8px;text-align:center;font-weight:700;font-size:9.5px;line-height:1.15;border:1px solid rgba(0,0,0,.3);cursor:default;position:static}
.mtab .mh-date,.mtab .mh-prim{background:#f2c43a;color:#1a1200}
.mtab .mh-sec{background:#28c850;color:#04210a}
.mtab .mh-atr{background:#a65cf0;color:#fff}
.mtab .mh-50{background:#3b9eff;color:#062038}
.mtab .mh-uni,.mtab .mh-spx{background:var(--bg4);color:var(--text2)}
.mtab td{text-align:right;padding:5px 8px;font-family:var(--sans);font-variant-numeric:tabular-nums}
.mtab td.date{text-align:left;color:var(--text);font-weight:600;position:sticky;left:0;background:var(--bg2)}
.m-gl{background:#bfe8c6;color:#0c2a14}
.m-gd{background:#2ec540;color:#04210a;font-weight:600}
.m-rl{background:#f4b6bf;color:#2a0a11}
.m-rd{background:#f0303a;color:#2a0408;font-weight:600}
.mctl{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border2)}
.mctl select{font-family:var(--mono);font-size:11px;background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:3px;padding:4px 8px}
.mctl label{font-size:9px;letter-spacing:1px;color:var(--text3);text-transform:uppercase}
.mcell.exp{cursor:pointer}
.mdetail{display:none}
.mdetail.show{display:table-row}
.mdetail>td{background:var(--bg4);padding:0}
.copybtn{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--accent);background:var(--bg3);border:1px solid var(--border2);border-radius:3px;padding:3px 9px;cursor:pointer}
.copybtn:hover{background:var(--adim)}
/* Earnings / Econ tables */
.etab{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
.etab thead th{position:sticky;top:0;padding:7px 10px;text-align:right;font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);background:var(--bg3);border-bottom:1px solid var(--border2);cursor:pointer;user-select:none}
.etab thead th.l{text-align:left}
.etab td{padding:6px 10px;text-align:right}
.etab td.l{text-align:left}
.etab tbody tr{border-bottom:1px solid rgba(28,37,53,.5)}
.etab tbody tr:hover{background:rgba(0,200,255,.04)}
.etab.eres td{font-variant-numeric:tabular-nums}
.etag{font-family:var(--mono);font-size:9px;letter-spacing:.5px;color:var(--amber);background:rgba(255,179,0,.1);border-radius:2px;padding:2px 5px}
.etag.amc{color:var(--accent);background:rgba(0,200,255,.1)}
.imp{font-size:9px;letter-spacing:.5px;padding:2px 7px;border-radius:2px;text-transform:uppercase}
.imp.high{color:var(--red);background:rgba(255,51,85,.14)}
.imp.medium{color:var(--amber);background:rgba(255,179,0,.14)}
.imp.low{color:var(--text3);background:var(--bg3)}
.daytabs{display:flex;gap:4px;padding:8px 10px;flex-wrap:wrap;border-bottom:1px solid var(--border2)}
.daytab{font-family:var(--mono);font-size:10px;letter-spacing:.5px;color:var(--text2);background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:6px 11px;cursor:pointer;display:flex;align-items:center;gap:6px}
.daytab:hover{color:var(--text)}
.daytab.on{color:var(--accent);border-color:var(--accent);background:rgba(0,200,255,.07)}
.daytab .dc{font-size:9px;color:var(--text3);background:var(--bg);border-radius:8px;padding:1px 6px}
.daytab.on .dc{color:var(--accent)}
/* ETF holdings drop-down */
.holdbox{padding:8px 11px 10px 28px;background:var(--bg4)}
.holdbox .h-title{font-size:9px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase}
.h-list{display:flex;flex-wrap:wrap;gap:6px}
.h-item{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;padding:3px 8px;font-size:11px}
.h-w{color:var(--accent);font-size:10px;min-width:36px;text-align:right}
.h-nm{color:var(--text3);font-size:10px}
.etfrow .arr{display:inline-block;transition:transform .15s}
.etfrow.open .arr{transform:rotate(90deg);color:var(--accent)}
/* full-page movers view */
.mv-hdr{display:flex;align-items:center;gap:14px;padding:12px 14px;border-bottom:1px solid var(--border2);flex-wrap:wrap}
.mv-back{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--text2);background:var(--bg3);border:1px solid var(--border2);border-radius:3px;padding:6px 12px;cursor:pointer}
.mv-back:hover{color:var(--accent);border-color:var(--accent)}
.mv-title{font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:1px}
.mv-title.up{color:var(--green)} .mv-title.dn{color:var(--red)}
.mv-count{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:1px}
.mv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding:14px}
.mv-tile{font-family:var(--mono);font-size:13px;font-weight:500;text-align:center;padding:12px 8px;border:1px solid var(--border2);border-bottom:1px solid var(--border2);border-radius:5px;background:var(--bg3);cursor:pointer;transition:.12s}
.mv-tile:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.mv-tile.up{border-left:3px solid var(--green)}
.mv-tile.dn{border-left:3px solid var(--red)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="mod-dd">
      <button class="mod-btn" id="moduleBtn"><span class="mod-ic">▦</span><span id="moduleLabel">Market Pulse</span><span class="caret">▾</span></button>
      <div class="mod-menu" id="moduleMenu"></div>
    </div>
    <div class="spacer"></div>
    <span class="badge" id="uniBadge">— names</span>
    <span class="badge" id="srcBadge">loading…</span>
    <span class="clock"><span class="cdot"></span><span id="clockTime">—</span></span>
    <span class="badge" id="asofBadge">—</span>
  </div>

  <div class="tape" id="tapeWrap">
    <div class="tape-lbl">MOVERS</div>
    <div class="marquee" id="tape"></div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="panel scroll"><div id="view"></div></div>
</div>

<!-- click-a-ticker chart -->
<div id="tvm" onclick="if(event.target===this)closeTv()">
  <div class="tvm-box">
    <div class="tvm-hdr"><span id="tvm-title">—</span>
      <button onclick="openNews()">NEWS ↗</button>
      <button onclick="openFilings()">FILINGS ↗</button>
      <button onclick="closeTv()">✕ CLOSE</button></div>
    <iframe id="tvm-frame" allowfullscreen></iframe>
  </div>
</div>
<!-- hover-a-ticker preview -->
<div id="hoverChart"><div class="hb" id="hoverSym"></div><img id="hoverImg" alt="" onerror="hideHover()"></div>
<!-- grid of mini charts -->
<div id="gridm" class="gridm">
  <div class="gridm-hdr"><span id="gridm-title">—</span><div class="gridm-tf" id="gridm-tf"></div>
    <button class="gclose" onclick="closeGrid()">✕ CLOSE</button></div>
  <div class="gridm-body" id="gridm-body"></div>
</div>

// ---- formatters ---------------------------------------------------------
function fpct(v){ if(v==null) return '<span class="zero">—</span>';
  const s=v>0?'+':''; const c=v>0?'var(--green)':v<0?'var(--red)':'var(--text3)';
  return `<span style="color:${c}">${s}${v.toFixed(2)}%</span>`; }
function heat(v,max){ if(v==null) return '';
  const a=Math.min(Math.abs(v)/max,1)*0.4;
  return v>0?`background:rgba(0,230,118,${a.toFixed(3)})`
            :v<0?`background:rgba(255,51,85,${a.toFixed(3)})`:''; }
function fvol(v){ if(v==null) return '—'; v=+v;
  if(v>=1e9) return '$'+(v/1e9).toFixed(1)+'B';
  if(v>=1e6) return '$'+(v/1e6).toFixed(0)+'M';
  if(v>=1e3) return '$'+(v/1e3).toFixed(0)+'K'; return '$'+v.toFixed(0); }
function fprice(v){ return v==null?'—':v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

// ---- sorting ------------------------------------------------------------
function sortRows(rows,cols,tabId){
  const st=SORT[tabId]; if(!st) return rows;
  const col=cols.find(c=>c.k===st.col); if(!col) return rows;
  const num = col.type!=='text';
  return [...rows].sort((a,b)=>{
    let x=a[st.col], y=b[st.col];
    if(num){ x=x==null?-1e18:x; y=y==null?-1e18:y; return st.dir*(y-x); }
    x=(''+x).toUpperCase(); y=(''+y).toUpperCase();
    return st.dir*(x<y?1:x>y?-1:0);
  });
}
function headerRow(cols,tabId){
  const st=SORT[tabId]||{};
  return '<tr>'+cols.map(c=>{
    const cls=c.type==='text'?'l':'';
    const ar=st.col===c.k?`<span class="ar">${st.dir<0?'▼':'▲'}</span>`:'';
    return `<th class="${cls}" data-col="${c.k}" data-tab="${tabId}">${c.label} ${ar}</th>`;
  }).join('')+'</tr>';
}

// ---- cell renderers -----------------------------------------------------
function perfCell(v,col){ return `<td>${fpct(v)}</td>`; }
function groupRows(rows,tab){
  let html='';
  rows.forEach((r,i)=>{
    html+=`<tr class="grp" data-i="${i}">`;
    GROUP_COLS.forEach(c=>{
      if(c.k==='name') html+=`<td class="l gname"><span class="arr">▸</span> ${r.name}</td>`;
      else if(c.k==='count') html+=`<td class="cnt">${r.count}</td>`;
      else if(c.type==='pct') html+=perfCell(r[c.k],c);
      else if(c.k==='new_highs') html+=`<td class="${r.new_highs?'nh':'zero'}">${r.new_highs||'—'}</td>`;
      else if(c.k==='new_lows') html+=`<td class="${r.new_lows?'nl':'zero'}">${r.new_lows||'—'}</td>`;
    });
    html+=`</tr><tr class="detail"><td colspan="${GROUP_COLS.length}"><div id="det${i}"></div></td></tr>`;
  });
  return html;
}

// ---- Earnings + Econ ----------------------------------------------------
function eUseSample(){ return !EDATA || EDATA.note==='no_api_key'; }
function eMoney(v){ if(v==null) return '—'; const n=+v, a=Math.abs(n);
  if(a>=1e12) return '$'+(n/1e12).toFixed(2)+'T';
  if(a>=1e9)  return '$'+(n/1e9).toFixed(2)+'B';
  if(a>=1e6)  return '$'+(n/1e6).toFixed(1)+'M';
  if(a>=1e3)  return '$'+(n/1e3).toFixed(0)+'K'; return '$'+n.toFixed(0); }
function eEps(v){ return v==null?'—':(v<0?'-$':'$')+Math.abs(v).toFixed(2); }
function eSurp(act,est){ if(act==null||est==null||est===0) return '<span class="zero">—</span>';
  const s=(act-est)/Math.abs(est)*100, c=s>=0?'var(--green)':'var(--red)';
  return `<span style="color:${c}">${s>=0?'+':''}${s.toFixed(1)}%</span>`; }
function eGrow(v){ if(v==null) return '<span class="zero">—</span>';
  const c=v>=0?'var(--green)':'var(--red)'; return `<span style="color:${c}">${v>=0?'+':''}${v.toFixed(1)}%</span>`; }
function eDay(v){ if(v==null) return '<span class="zero">—</span>';
  const c=v>0?'var(--green)':v<0?'var(--red)':'var(--text3)'; return `<span style="color:${c}">${v>0?'+':''}${(+v).toFixed(2)}%</span>`; }
function eTime(t){ t=(t||'').toLowerCase();
  if(t.includes('bmo')||t==='bmo') return '<span class="etag">BMO</span>';
  if(t.includes('amc')||t==='amc') return '<span class="etag amc">AMC</span>';
  return t?`<span class="etag">${t.toUpperCase()}</span>`:''; }
function eHead(sample){ return sample?'<span class="badge demo" style="margin-left:8px">● SAMPLE</span>':''; }

function renderEcon(){
  const D=EDATA||EARN_SAMPLE, ev=D.econ||[], sample=eUseSample();

  h+='<div class="scroll"><table class="etab"><thead><tr>'
    +'<th class="l">Date</th><th class="l">Event</th><th>Impact</th><th>Estimate</th><th>Previous</th><th>Actual</th></tr></thead><tbody>';
  if(!ev.length) h+='<tr><td colspan="6" class="muted" style="padding:16px">No economic events loaded. If this stays empty after a run, the free API tier may not serve the economic calendar — tell me and I\'ll swap the source.</td></tr>';
  ev.forEach(e=>{ const imp=(e.impact||'').toLowerCase();
    h+=`<tr><td class="l muted">${e.date||''}</td><td class="l" style="color:#f4f8fc">${e.event||''}</td>`
      +`<td><span class="imp ${imp}">${e.impact||'—'}</span></td>`
      +`<td>${e.estimate==null?'—':e.estimate}</td><td class="muted">${e.previous==null?'—':e.previous}</td>`
      +`<td style="font-weight:600">${e.actual==null?'<span class="zero">—</span>':e.actual}</td></tr>`; });
  h+='</tbody></table></div>';
  document.getElementById('view').innerHTML=h;
}

    if(num(S.col)){ x=x==null?-1e18:x; y=y==null?-1e18:y; return S.dir<0?y-x:x-y; }
    x=(''+(x||'')).toUpperCase(); y=(''+(y||'')).toUpperCase(); return (S.dir<0?-1:1)*(x<y?-1:x>y?1:0); });
  const cols=[['date','Date','l'],['sym','Ticker','l'],['name','Company','l'],['time','Time',''],

  rows.forEach(r=>{
    h+='<tr>'

      +`<td>${eTime(r.time)}</td>`
      +`<td class="muted">${eMoney(r.mktcap)}</td>`
      +`<td class="muted">${eEps(r.eps_est)}</td>`
      +`<td style="font-weight:600;color:#f4f8fc">${eEps(r.eps)}</td>`
      +`<td>${eSurp(r.eps,r.eps_est)}</td>`
      +`<td>${eGrow(r.eps_yoy)}</td>`
      +`<td class="muted">${eMoney(r.rev_est)}</td>`
      +`<td style="font-weight:600;color:#f4f8fc">${eMoney(r.rev)}</td>`
      +`<td>${eSurp(r.rev,r.rev_est)}</td>`
      +`<td>${eGrow(r.rev_yoy)}</td>`
      +`<td class="muted">${eEps(r.fwd_eps_est)}</td>`

  });
  h+='</tbody></table></div>';
  const v=document.getElementById('view'); v.innerHTML=h;
  v.querySelectorAll('thead th[data-ec]').forEach(th=>th.onclick=()=>{
    const c=th.dataset.ec; window._eresSort = S.col===c?{col:c,dir:-S.dir}:{col:c,dir:num(c)?-1:1}; render(); });
}

function render(){
  const mod=curModule();
  if(!mod.tabs.includes(ACTIVE)) ACTIVE=mod.tabs[0];
  const tabsEl=document.getElementById('tabs');
  if(mod.tabs.length>1){ tabsEl.style.display='flex';
    tabsEl.innerHTML=mod.tabs.map(id=>{const t=TAB(id);
      return `<div class="tab ${id===ACTIVE?'on':''}" data-tab="${id}">${t.label}</div>`;}).join('');
  } else { tabsEl.style.display='none'; tabsEl.innerHTML=''; }
  const tab=TAB(ACTIVE);
  const view=document.getElementById('view');

  if(tab.kind==='monitor'){ moversView ? renderMovers() : renderMonitor(); return; }
  if(tab.kind==='econ'){ renderEcon(); return; }
  if(tab.kind==='ecal'){ renderEcal(); return; }
  if(tab.kind==='eres'){ renderEres(); return; }
  if(tab.kind==='nhl'){ view.innerHTML=nhlView(); bindNhl(); return; }

  if(tab.kind==='etf'){
    const cols=etfCols();
    const rows=sortRows(tab.src(DATA),cols,ACTIVE), H=DATA.etf_holdings||{};
    let h='<table><thead>'+headerRow(cols,ACTIVE)+'</thead><tbody>';
    rows.forEach((r,i)=>{
      const hold=H[r.sym];
      h+=`<tr class="grp etfrow" data-ei="${i}" style="cursor:${hold?'pointer':'default'}">`;
      cols.forEach(c=>{
        if(c.k==='sym') h+=`<td class="l">${hold?'<span class="arr" style="color:var(--text3)">▸</span> ':''}<span class="tk sym" data-sym="${r.sym}">${r.sym}</span></td>`;
        else if(c.k==='name') h+=`<td class="l" style="color:#f4f8fc">${r.name||''}</td>`;
        else if(c.k==='price') h+=`<td>${fprice(r.price)}</td>`;
        else h+=perfCell(r[c.k],c);
      });
      h+='</tr>';
      if(hold){
        h+=`<tr class="detail" id="ed${i}"><td colspan="${cols.length}"><div class="holdbox">`
          +`<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span class="h-title">TOP ${hold.length} HOLDINGS</span>`
          +`<button class="copybtn" onclick='copyTickers(${JSON.stringify(hold.map(x=>x.sym))},this)'>COPY</button></div>`
          +'<div class="h-list">'+hold.map(x=>`<span class="h-item"><span class="h-w">${x.w?x.w.toFixed(1)+'%':''}</span><span class="tk sym h-sym" data-sym="${x.sym}">${x.sym}</span><span class="h-nm">${x.name||''}</span></span>`).join('')+'</div></div></td></tr>';
      }
    });
    view.innerHTML=h+'</tbody></table>';
    bindSort();
    document.querySelectorAll('tr.etfrow[data-ei]').forEach(tr=>{
      tr.onclick=e=>{ if(e.target.closest('.tk')) return;
        const det=document.getElementById('ed'+tr.dataset.ei); if(det){ det.classList.toggle('show'); tr.classList.toggle('open'); } };
    });
    return;
  }
  // group
  if(!SORT[ACTIVE]) SORT[ACTIVE]={col:'m1',dir:-1};
  const rows=sortRows(tab.src(DATA),GROUP_COLS,ACTIVE);
  view.innerHTML='<table><thead>'+headerRow(GROUP_COLS,ACTIVE)+'</thead><tbody>'+groupRows(rows,tab)+'</tbody></table>';
  bindSort();
  bindGroupDrill(rows,tab);
}
function bindSort(){
  document.querySelectorAll('thead th[data-col]').forEach(th=>{
    th.onclick=()=>{ const tabId=th.dataset.tab, col=th.dataset.col;
      const st=SORT[tabId]||{col:null,dir:-1};
      SORT[tabId]= st.col===col?{col,dir:-st.dir}:{col,dir:-1};
      if(tabId.startsWith('_sub')) reRenderOpenDetails(); else render();
    };
  });
}
let OPEN=new Set();
function bindGroupDrill(rows,tab){
  OPEN=new Set();
  document.querySelectorAll('tr.grp[data-i]').forEach(tr=>{
    tr.onclick=()=>{
      const i=+tr.dataset.i, det=tr.nextElementSibling;
      const open=det.classList.toggle('show'); tr.classList.toggle('open',open);
      if(open){ OPEN.add(i);
        const key=tab.drill, val=rows[i].name;
        const members=Object.entries(DATA.tickers)
          .filter(([s,m])=>m[key]===val).map(([s,m])=>({sym:s,...m}));
        document.getElementById('det'+i).innerHTML=stockSubTable(members, rows[i].name);
        bindSort();

    };
  });

function reRenderOpenDetails(){ const tab=TABS.find(t=>t.id===ACTIVE);

  OPEN.forEach(i=>{ const key=tab.drill,val=rows[i]?.name; if(val==null)return;
    const members=Object.entries(DATA.tickers).filter(([s,m])=>m[key]===val).map(([s,m])=>({sym:s,...m}));

function openTv(sym){

function openChartFrom(el){
  // build a navigation list from the nearest table / tape so ←/→ step through it
  const scope = el.closest('table') || el.closest('.mv-grid') || el.closest('.marquee') || document;
  const nodes = [...scope.querySelectorAll('.tk')];
  chartList = nodes.map(n=>n.dataset.sym);

  openTv(el.dataset.sym);
}
function stepChart(delta){
  if(!chartList.length || chartIdx<0) return;
  chartIdx = Math.max(0, Math.min(chartList.length-1, chartIdx+delta));
  openTv(chartList[chartIdx]);
}

function copyTickers(syms,btn){

    const o=btn.textContent; btn.textContent='COPIED ✓'; setTimeout(()=>btn.textContent=o,1200);
  }).catch(()=>{ btn.textContent='COPY FAILED'; });

function closeTv(){
  document.getElementById('tvm').classList.remove('on');
  document.getElementById('tvm-frame').src='';
  document.body.style.overflow='';

function showHover(el){
  const sym=el.dataset.sym; if(!sym) return;
  const box=document.getElementById('hoverChart');
  document.getElementById('hoverSym').textContent=sym;
  document.getElementById('hoverImg').src='https://finviz.com/chart.ashx?t='+encodeURIComponent(sym)+'&ty=c&ta=1&p=d&s=l&_='+Date.now();
  const r=el.getBoundingClientRect(), W=362, H=236;
  let left=r.right+12; if(left+W>innerWidth) left=r.left-W-12;
  let top=r.top; if(top+H>innerHeight) top=innerHeight-H-8;
  box.style.left=Math.max(8,left)+'px'; box.style.top=Math.max(8,top)+'px';
  box.style.display='block';
}
function hideHover(){ document.getElementById('hoverChart').style.display='none'; }
function bindTickers(){
  document.addEventListener('click',e=>{ const t=e.target.closest('.tk'); if(t){ e.stopPropagation(); openChartFrom(t);} });
  document.addEventListener('mouseover',e=>{ const t=e.target.closest('.tk'); if(t) showHover(t); });
  document.addEventListener('mouseout',e=>{ const t=e.target.closest('.tk'); if(t) hideHover(); });
  window.addEventListener('scroll',hideHover,true);
  document.addEventListener('keydown',e=>{
    const open=document.getElementById('tvm').classList.contains('on');
    if(e.key==='Escape') closeTv();
    else if(open && e.key==='ArrowRight'){ e.preventDefault(); stepChart(1); }
    else if(open && e.key==='ArrowLeft'){ e.preventDefault(); stepChart(-1); }
  });
}

// ---- Market Monitor -----------------------------------------------------
function monColors(r, big){
  const c={};
  if(r.up4>=big) c.up4='m-gd'; else if(r.up4>r.dn4) c.up4='m-gl';
  if(r.dn4>=big) c.dn4='m-rd'; else if(r.dn4>r.up4) c.dn4='m-rl';
  c.r5  = r.r5==null ? '' : (r.r5>=2?'m-gd':r.r5<0.5?'m-rd':'');
  c.r10 = r.r10==null? '' : (r.r10>=2?'m-gd':r.r10<0.5?'m-rd':'');
  const pair=(ku,kd)=>{ if(r[ku]>r[kd]){c[ku]='m-gd';c[kd]='m-gd';} else if(r[kd]>r[ku]){c[ku]='m-rd';c[kd]='m-rd';} };
  pair('up25q','dn25q'); pair('up25m','dn25m'); pair('up13','dn13');
  if(r.up50m>=30) c.up50m='m-gd';
  if(r.dn50m>=30) c.dn50m='m-rd';
  return c;
}
function nameList(kind, syms){
  const col=kind==='up4'?'var(--green)':'var(--red)', arr=kind==='up4'?'▲':'▼';
  const chips=syms.map(s=>`<span class="t"><span style="color:${col}">${arr}</span> <b class="tk" data-sym="${s}">${s}</b></span>`).join(' ');
  const title=kind==='up4'?'UP 4% TODAY':'DOWN 4% TODAY';
  return `<div class="tklist"><div style="display:flex;align-items:center;gap:10px;margin-bottom:5px">`
    +`<span class="h-title">${title} · ${syms.length}</span>`
    +`<button class="copybtn" onclick='copyTickers(${JSON.stringify(syms)},this)'>COPY</button></div>`
    +(chips||'<span class="muted">—</span>')+`</div>`;
}
let MON_YEAR=null, moversView=null;
let MSORT={up4:{col:'pct',dir:-1}, dn4:{col:'pct',dir:1}};
function openMovers(kind){ moversView=kind; render(); }
function closeMovers(){ moversView=null; render(); }
function fshares(v){ if(v==null) return '—'; v=+v;
  if(v>=1e9) return (v/1e9).toFixed(1)+'B';
  if(v>=1e6) return (v/1e6).toFixed(1)+'M';
  if(v>=1e3) return (v/1e3).toFixed(0)+'K'; return ''+v; }
function sortMovers(items,kind){
  const s=MSORT[kind], c=s.col, num=(c!=='sym'&&c!=='ind');
  return [...items].sort((a,b)=>{
    let x=a[c], y=b[c];
    if(num){ x=(x==null?-1e18:x); y=(y==null?-1e18:y); return s.dir<0 ? y-x : x-y; }
    x=(''+(x||'')).toUpperCase(); y=(''+(y||'')).toUpperCase();
    return (s.dir<0?-1:1)*(x<y?-1:x>y?1:0);
  });
}
function renderMovers(){
  const D=MDATA||MONITOR_SAMPLE, kind=moversView, up=kind==='up4';
  let items=((D.today_members&&D.today_members[kind])||[]).map(x=>typeof x==='string'?{sym:x}:x);

  const latest=(D.rows&&D.rows[0])?D.rows[0].date:'';
  const rows=sortMovers(items,kind), s=MSORT[kind];

  html+='<div class="scroll"><table class="mvt"><thead><tr>'
    +cols.map(([k,l])=>`<th class="${k==='sym'||k==='ind'?'l':''}" data-mc="${k}">${l}${s.col===k?' '+(s.dir<0?'▼':'▲'):''}</th>`).join('')
    +'</tr></thead><tbody>';
  if(!rows.length) html+='<tr><td colspan="5" class="muted" style="padding:16px">No names today.</td></tr>';
  rows.forEach(m=>{
    const pcol=m.pct==null?'':(m.pct>0?'color:var(--green)':'color:var(--red)');
    html+='<tr>'
      +`<td class="l"><span class="tk sym" data-sym="${m.sym}">${m.sym}</span></td>`
      +`<td style="${pcol}">${m.pct==null?'—':(m.pct>0?'+':'')+m.pct.toFixed(2)+'%'}</td>`
      +`<td class="muted">${fshares(m.vol)}</td>`
      +`<td class="muted">${m.dvol==null?'—':fvol(m.dvol)}</td>`
      +`<td class="l" style="color:var(--text2)">${m.ind||'—'}</td></tr>`;
  });
  html+='</tbody></table></div>';
  document.getElementById('view').innerHTML=html;
  document.querySelectorAll('.mvt thead th[data-mc]').forEach(th=>{
    th.onclick=()=>{ const c=th.dataset.mc, cur=MSORT[kind];
      MSORT[kind]= cur.col===c ? {col:c,dir:-cur.dir} : {col:c, dir:(c==='sym'||c==='ind')?1:-1};
      render(); };

    +'</tr></thead><tbody>';
  rows.forEach((r,ri)=>{

      +`<td>${num(r.atr10x)}</td><td>${r.pct50==null?'—':r.pct50.toFixed(1)+'%'}</td>`
      +`<td class="muted">${num(r.universe)}</td><td>${r.spx==null?'—':r.spx.toLocaleString()}</td></tr>`;
  });
  html+='</tbody></table></div>';
  document.getElementById('view').innerHTML=html;
  const ys=document.getElementById('monYear'); if(ys) ys.onchange=()=>{ MON_YEAR=ys.value; render(); };
}

fetch('data/data.json?_='+Date.now())
  .then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(d=>boot(d,true))
  .catch(()=>boot(SAMPLE,false));

// Market Monitor data loads independently (its own pipeline / file)
fetch('data/monitor.json?_='+Date.now())
  .then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(d=>{ MDATA=d; if(ACTIVE==='monitor') render(); })
  .catch(()=>{ MDATA = MONITOR_SAMPLE; if(ACTIVE==='monitor') render(); });

// Earnings + econ calendar (its own pipeline / file)
fetch('data/earnings.json?_='+Date.now())
  .then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(d=>{ EDATA=d; if(['econ','ecal','eres'].includes(ACTIVE)) render(); })
  .catch(()=>{ EDATA = EARN_SAMPLE; if(['econ','ecal','eres'].includes(ACTIVE)) render(); });
</script>
</body>
</html>
