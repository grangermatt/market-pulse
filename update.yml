name: Update Market Pulse data

on:
  schedule:
    - cron: '0 22 * * 1-5'   # ~2pm PT / 5pm ET weekdays, after US close
  workflow_dispatch: {}       # adds a manual "Run workflow" button

permissions:
  contents: write             # lets the job commit data back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dashboard data (data.json)
        run: python fetch_data.py

      - name: Build market monitor (monitor.json)
        run: python fetch_monitor.py

      - name: Commit refreshed data
        run: |
          git config user.name  "market-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "data: $(date -u +%Y-%m-%d)" || echo "no changes to commit"
          git push
